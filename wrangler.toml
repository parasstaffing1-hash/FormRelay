name = "formrelay"
main = "src/index.tsx"
compatibility_date = "2025-01-01"
# Required by the Postgres driver (postgres.js needs node:net / node:crypto shims).
compatibility_flags = ["nodejs_compat"]

# Pools Postgres connections on Cloudflare's side. A Worker opens a connection per isolate
# and Postgres caps concurrent connections, so connecting directly does not survive traffic.
# Create with: npx wrangler hyperdrive create formrelay-pg --connection-string="<url>"
# then paste the id below and uncomment.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "REPLACE_WITH_YOUR_HYPERDRIVE_ID"

[[d1_databases]]
binding = "DB"
database_name = "formrelay"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# File uploads, plus spill storage for submission payloads over 10 KB.
# Create the bucket once: npx wrangler r2 bucket create formrelay-files
# `wrangler dev` simulates this locally, so no bucket is needed for local work.
[[r2_buckets]]
binding = "FILES"
bucket_name = "formrelay-files"

# Drives webhook retries. Every five minutes the Worker drains deliveries whose
# backoff has elapsed; without this trigger a failed delivery is never retried.
[triggers]
crons = ["*/5 * * * *"]
